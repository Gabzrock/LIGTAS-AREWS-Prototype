  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIGTAS-AREWS Prototype</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #777777;
            --accent-blue: #007bff;
            --accent-red: #dc3545;
            --accent-green: #28a745;
            --accent-warning: #ffc107;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5em;
            color: var(--accent-blue);
        }

        header p {
            margin: 5px 0 0 0;
            color: var(--text-muted);
        }

        /* Status & Values Grid */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
            border-top: 4px solid var(--accent-blue);
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            margin: 0 0 10px 0;
            font-size: 1.1em;
            color: var(--text-muted);
        }

        .card .value {
            font-size: 2em;
            font-weight: bold;
            margin: 0;
        }

        .card .unit {
            font-size: 0.5em;
            color: var(--text-muted);
        }

        /* Specific Card Colors */
        .card.temp { border-color: var(--accent-red); }
        .card.hum { border-color: var(--accent-blue); }
        .card.rain { border-color: #17a2b8; }
        .card.warn { border-color: var(--accent-warning); }
        .card.soil { border-color: var(--accent-green); }

        /* Charts Section */
        .charts-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }

        .chart-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        canvas {
            width: 100% !important;
            height: 300px !important;
        }

        .timestamp {
            text-align: center;
            font-size: 0.9em;
            color: var(--text-muted);
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <header>
        <h1>LIGTAS-AREWS Prototype</h1>
        <p>Live Environmental Monitoring Dashboard</p>
    </header>

    <div class="grid-container">
        <div class="card temp">
            <h3>Temperature</h3>
            <p class="value" id="val-temp">-- <span class="unit">°C</span></p>
        </div>
        <div class="card hum">
            <h3>Humidity</h3>
            <p class="value" id="val-hum">-- <span class="unit">%</span></p>
        </div>
        <div class="card soil">
            <h3>Soil Moisture</h3>
            <p class="value" id="val-soil">-- <span class="unit">%</span></p>
        </div>
        <div class="card rain">
            <h3>7-day Antecedent+Cumulative Rain</h3>
            <p class="value" id="val-dayrain">-- <span class="unit">mm</span></p>
        </div>
        <div class="card rain">
            <h3>Rain Rate</h3>
            <p class="value" id="val-rate">-- <span class="unit">mm/hr</span></p>
        </div>
        <div class="card warn">
            <h3>Warning Level</h3>
            <p class="value" id="val-warn">-- <span class="unit">Code</span></p>
        </div>
    </div>

    <div class="charts-container">
        <div class="chart-card">
            <canvas id="tempHumChart"></canvas>
        </div>
        <div class="chart-card">
            <canvas id="rainChart"></canvas>
        </div>
    </div>

    <div class="timestamp" id="last-update">Last Updated: Waiting for data...</div>

    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        const CHANNEL_ID = '3001025'; // Replace with your ThingSpeak Channel ID
        const READ_API_KEY = '17J4D5A22CI2G6O9'; // Add your Read API Key if the channel is private
        const RESULTS_TO_FETCH = 30; // Number of data points to show on the charts
        
        // Timer for auto-refresh (60 seconds)
        const REFRESH_INTERVAL_MS = 60000;

        // ==========================================
        // CHART INITIALIZATION
        // ==========================================
        const ctxTemp = document.getElementById('tempHumChart').getContext('2d');
        const tempHumChart = new Chart(ctxTemp, {
            type: 'line',
            data: { labels: [], datasets: [
                { label: 'Temperature (°C)', borderColor: '#dc3545', backgroundColor: 'rgba(220, 53, 69, 0.1)', data: [], fill: true, tension: 0.3 },
                { label: 'Soil Moisture (%)', borderColor: '#28a745', backgroundColor: 'rgba(40, 167, 69, 0.1)', data: [], fill: true, tension: 0.3 }
            ]},
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });

        const ctxRain = document.getElementById('rainChart').getContext('2d');
        const rainChart = new Chart(ctxRain, {
            type: 'bar',
            data: { labels: [], datasets: [
                { label: '7-day Antecedent+Cummulative rain (mm)', backgroundColor: '#17a2b8', data: [] },
                { label: 'Hourly Rain (mm)', backgroundColor: '#007bff', data: [] }
            ]},
            options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
        });

        // ==========================================
        // FETCH DATA FROM THINGSPEAK
        // ==========================================
        async function fetchThingSpeakData() {
            let url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?results=${RESULTS_TO_FETCH}`;
            if (READ_API_KEY !== '') {
                url += `&api_key=${READ_API_KEY}`;
            }

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.feeds && data.feeds.length > 0) {
                    updateDashboard(data.feeds);
                }
            } catch (error) {
                console.error("Error fetching data from ThingSpeak:", error);
                document.getElementById('last-update').innerText = "Error fetching data. Check internet or API credentials.";
            }
        }

        // ==========================================
        // UPDATE UI ELEMENTS
        // ==========================================
        function updateDashboard(feeds) {
            // Get the absolute latest feed (last item in the array)
            const latest = feeds[feeds.length - 1];

            // 1. Update Number Cards
            // Check if field exists, otherwise show '0.0'
            document.getElementById('val-temp').innerHTML = `${parseFloat(latest.field1 || 0).toFixed(1)} <span class="unit">°C</span>`;
            document.getElementById('val-hum').innerHTML = `${parseFloat(latest.field2 || 0).toFixed(1)} <span class="unit">%</span>`;
            document.getElementById('val-dayrain').innerHTML = `${parseFloat(latest.field5 || 0).toFixed(2)} <span class="unit">mm</span>`;
            document.getElementById('val-rate').innerHTML = `${parseFloat(latest.field6 || 0).toFixed(2)} <span class="unit">mm/hr</span>`;
            document.getElementById('val-warn').innerHTML = `${latest.field7 || 0} <span class="unit">Code</span>`;
            document.getElementById('val-soil').innerHTML = `${parseFloat(latest.field8 || 0).toFixed(1)} <span class="unit">%</span>`;

            // Change Warning Card color dynamically based on danger level
            const warnCard = document.querySelector('.card.warn');
            const warnLvl = parseInt(latest.field7 || 0);
            if(warnLvl === 0) warnCard.style.borderColor = '#28a745'; // Green
            else if(warnLvl === 1) warnCard.style.borderColor = '#ffc107'; // Yellow
            else if(warnLvl === 2) warnCard.style.borderColor = '#fd7e14'; // Orange
            else if(warnLvl >= 3) warnCard.style.borderColor = '#dc3545'; // Red

            // 2. Prepare Data Arrays for Charts
            const labels = [];
            const tempData = [], soilData = [];
            const dayRainData = [], hrRainData = [];

            feeds.forEach(feed => {
                // Format the timestamp nicely
                const date = new Date(feed.created_at);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                labels.push(timeStr);

                tempData.push(feed.field1);
                soilData.push(feed.field8);
                
                hrRainData.push(feed.field4);
                dayRainData.push(feed.field5);
            });

            // 3. Update Chart Objects
            tempHumChart.data.labels = labels;
            tempHumChart.data.datasets.data = tempData;
            tempHumChart.data.datasets.data = soilData;
            tempHumChart.update();

            rainChart.data.labels = labels;
            rainChart.data.datasets.data = dayRainData;
            rainChart.data.datasets.data = hrRainData;
            rainChart.update();

            // 4. Update Last Updated Text
            const lastTime = new Date(latest.created_at);
            document.getElementById('last-update').innerText = "Last Updated: " + lastTime.toLocaleString();
        }

        // Initialize dashboard and set interval
        fetchThingSpeakData();
        setInterval(fetchThingSpeakData, REFRESH_INTERVAL_MS);

    </script>
</body>
</html>
    
  </body>
  
</html>
